name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev libffi-dev python3-dev git zip unzip
        sudo apt-get install -y build-essential ccache libncurses5 libtool libffi-dev \
                                libssl-dev autoconf automake cmake zlib1g-dev \
                                zlib1g libjpeg-dev libfreetype6-dev
        pip install --upgrade pip setuptools
        pip install buildozer cython

    - name: Set up Android SDK
      run: |
        sudo apt-get install -y wget
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q commandlinetools-linux-8512546_latest.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Install Buildozer dependencies
      run: |
        sudo apt-get install -y libltdl-dev lzop lxc zlib1g-dev

    - name: Install Buildozer
      run: |
        pip install buildozer

    - name: Ensure build directories exist
      run: |
        mkdir -p .buildozer/android/platform/android-sdk
        mkdir -p .buildozer/android/platform/android-ndk-r21d

    - name: Set up Android SDK in Buildozer
      run: |
        export ANDROIDSDK="$HOME/android-sdk"
        export ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r21d"
        export ANDROIDAPI="30"
        export ANDROIDMINAPI="21"
        buildozer android update

    - name: Prepare build environment
      run: buildozer android clean

    - name: Build the APK
      run: buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: my-app-debug.apk
        path: bin/*
